name: storage-model
description: >-
  Decided at deploy and refused afterwards. Where the data lives (mode), how it
  is laid out on disk (storageModel) and which object store holds it are all one
  decision made once: changing any of them on a live deployment strands the rows
  and segments already written, so it is a data migration and not a values edit.
  Holders of helmvars:override can still make a deliberate exception.
protected:
  - "infravars:*:clickhouse.mode"
  - "infravars:*:clickhouse.storageModel"
  - "infravars:*:clickhouse.s3.*"
  - "infravars:*:kafka.mode"
  - "infravars:*:kafka.storageModel"
  - "infravars:*:kafka.tiered.*"
