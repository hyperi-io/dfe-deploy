# Tags main and renders the changelog (CONTRIBUTING.md "Commands that prove a change").
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create the tag, the release, and the changelog commit

# A second push must not tag concurrently with the first. Never cancel: a
# half-finished release leaves a tag with no changelog behind it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # semantic-release reads history and existing tags

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # A tag is permanent, so the governance gate runs first.
      - name: Install pinned PyYAML
        run: python3 -m pip install --require-hashes -r tools/requirements-validate.txt

      - name: Gate -- governance tree
        run: python3 tools/validate_governance.py

      - name: Gate -- validator tests
        run: python3 -m unittest discover -s tools

      - uses: hyperi-io/hyperi-ci/.github/actions/setup-semantic-release@main

      - name: Tag + render the changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # semantic-release exits 0 whether or not it tagged, so the tag is the signal.
      - name: Did it release?
        id: rel
        run: |
          set -euo pipefail
          TAG=$(git tag --points-at HEAD --list 'v[0-9]*' | head -n1)
          if [ -z "$TAG" ]; then
            echo "no release-worthy commits since the last tag"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "released ${TAG}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the GitHub release
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.rel.outputs.tag }}" --verify-tag --title "dfe-deploy ${{ steps.rel.outputs.tag }}" --generate-notes

      # Runs on every push, so a tag whose changelog commit never landed gets it next time.
      - name: Commit the changelog back
        run: |
          set -euo pipefail
          python3 tools/changelog_backfill.py --repo "${{ github.repository }}"
          # --porcelain, not `git diff`: on the first release CHANGELOG.md is a
          # NEW file, which git diff reports as no change.
          if [ -z "$(git status --porcelain -- CHANGELOG.md)" ]; then
            echo "CHANGELOG.md unchanged"
            exit 0
          fi
          git config user.name "hyperi-ci"
          git config user.email "ci@hyperi.io"
          git add CHANGELOG.md
          git commit -m "chore(release): ${{ steps.rel.outputs.tag || 'changelog entries' }} [skip ci]"
          # Another push can land meanwhile, so retry on a rebase. A conflicting CHANGELOG.md edit stops the job.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}), rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::changelog commit could not be pushed after 5 attempts"
          exit 1
