# pins.yaml -- the HyperI-provided base, referenced by PINNED version.
#
# This is the only coupling to the vendor repos. The base is pulled by reference
# (Argo CD multi-source / Helm dependency / OCI) at these versions -- never
# vendored in, never a git submodule. To update the base: bump a version here and
# commit; your values/ and config/ are untouched.
#
# Pin policy (see dfe-docs): adopt a version only once it is >= 7 days old
# (supply-chain cooldown) and prefer an LTS line where one exists.

base:
  dfe-infra: "2.2.0"      # charts, appsets, defaults, deployment machinery.
  #                         ONE pin selects the WHOLE certified stack: dfe-infra's
  #                         versions.yaml at this tag is the stack manifest (every
  #                         dfe-* app image, operator, data service). See
  #                         dfe-docs/deployment/stack-versioning.md.
  dfe-schemas: "2.2.0"    # baseline tables/views/DDL (lockstep tag by default)

# Release channel this environment tracks: alpha | beta | rc | release
# (the maturity ladder). Reconciled 2026-07-16 with the dfe-infra SSoT ladder --
# "spike" was dropped (it inverts SemVer prerelease ordering) and "rc" added.
# A channel resolves to the latest stack of that maturity (versions.yaml
# current/latest/lts + per-stack maturity). Dev/devex -> alpha or rc;
# staging -> rc; production/customer -> release.
channel: "release"

# Per-component overrides -- move ONE component off the certified set, at your
# own documented risk. Precedence: overrides > the certified manifest; use
# tag@sha256 digests, never floating tags (rejected otherwise). dfe-engine
# prints a SUPPORT-DRIFT notice at startup for every entry here. To apply an
# override to the cluster, emit the per-service fragments and MERGE each into
# that service's existing values/{service}-{instance}-values.yaml (never a new
# standalone file - the Argo files generator treats every values/*-values.yaml
# as an app):
#   dfe-infra/scripts/dfe-stack resolve --pins pins.yaml --emit-values -
# overrides:
#   apps:
#     dfe-receiver: "v1.16.0@sha256:..."
